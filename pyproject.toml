[project]
name = "aegis-incident-copilot"
version = "0.1.0"
description = "Multi-agent incident intelligence copilot: polls public status-page APIs, triages incidents, retrieves grounded evidence from postmortems/runbooks, and drafts a critic-verified root-cause hypothesis for human approval."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "anthropic>=0.39",
    "sentence-transformers>=3.2",
    "rank-bm25>=0.2.2",
    "tenacity>=9.0",
    "python-dotenv>=1.0",
    "structlog>=24.4",
]

[project.optional-dependencies]
eval = [
    "ragas>=0.2",
    "rouge-score>=0.1.2",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
