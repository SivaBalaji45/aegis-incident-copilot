services:
  db:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
      POSTGRES_DB: aegis
    ports:
      - "5432:5432"
    volumes:
      - aegis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL_ASYNC: postgresql+asyncpg://aegis:aegis@db:5432/aegis
      DATABASE_URL: postgresql+psycopg://aegis:aegis@db:5432/aegis
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python scripts/init_db.py && uvicorn aegis.api.main:app --host 0.0.0.0 --port 8000"

volumes:
  aegis_pgdata:
